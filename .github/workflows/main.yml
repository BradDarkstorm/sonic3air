# Builds the Sonic 3 A.I.R. Online Co-op edition for Windows (64-bit).
# Runs on GitHub's servers -- nothing needs to be installed on your PC.
#
# Each build downloads the newest STABLE Sonic 3 A.I.R. release from Eukaryot's repository
# and applies the co-op changes from the "coop" folder on top (see coop/apply_coop.py).
# So when the game updates, just run this again -- no need to sync your fork.
#
# How to use:
#   1. Actions tab -> "Build Co-op (Windows)" -> "Run workflow" (it also runs on every push).
#   2. Wait for the run to finish (first run takes roughly 30 minutes, it builds all libraries).
#   3. Download the "Sonic3AIR-Coop-Windows" artifact at the bottom of the run page.

name: Build Co-op (Windows)

on:
  workflow_dispatch:
    inputs:
      game_version:
        description: 'Game version: "latest-stable", or a tag like v26.03.28.0-stable, or "master" for the newest test version'
        required: false
        default: 'latest-stable'
  push:
    branches: [ main, master, coop ]

jobs:
  build:
    # windows-2022 ships Visual Studio 2022 (toolset v143), which the S3AIR projects expect
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out this repository (for the co-op files)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Pick game version
        id: version
        shell: pwsh
        run: |
          $wanted = "${{ github.event.inputs.game_version }}"
          if ([string]::IsNullOrWhiteSpace($wanted) -or $wanted -eq "latest-stable") {
            $tags = git ls-remote --tags --refs https://github.com/Eukaryot/sonic3air |
              ForEach-Object { ($_ -split "refs/tags/")[1] } |
              Where-Object { $_ -match '^v(\d+)\.(\d+)\.(\d+)\.(\d+)-stable$' }
            $wanted = $tags | Sort-Object { [version](($_ -replace '^v','') -replace '-stable$','') } | Select-Object -Last 1
          }
          if (-not $wanted) { throw "Could not determine game version" }
          Write-Host "Building on game version: $wanted"
          "ref=$wanted" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Sonic 3 A.I.R. source (${{ steps.version.outputs.ref }})
        shell: pwsh
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.ref }}" https://github.com/Eukaryot/sonic3air.git game
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }

      - name: Apply co-op changes
        shell: pwsh
        run: |
          python fork/coop/apply_coop.py game
          if ($LASTEXITCODE -ne 0) { throw "Applying co-op changes failed, see the message above" }

      - name: Point the S3AIR build scripts at this machine's MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          Write-Host "Using MSBuild: $msbuild"
          Set-Content -Path game/framework/external/get_msbuild_path.bat -Encoding ascii -Value "@echo off`r`nset msbuildPath=`"$msbuild`"`r`n"
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache prebuilt external libraries
        id: cache-externals
        uses: actions/cache@v4
        with:
          # The library build scripts copy their results to both framework/lib and framework/include
          path: |
            game/framework/lib
            game/framework/include
          key: externals-v2-${{ runner.os }}-${{ hashFiles('game/framework/external/**/*.bat', 'game/framework/external/**/*.sln') }}

      - name: Build external libraries (SDL, zlib, ogg/vorbis, curl, imgui)
        if: steps.cache-externals.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: game/framework/external
        run: |
          pushd sdl        && call build_sdl.bat no_pause        && popd
          pushd zlib       && call build_zlib.bat no_pause       && popd
          pushd ogg-vorbis && call build_ogg-vorbis.bat no_pause && popd
          pushd curl       && call build_curl.bat no_pause       && popd
          pushd imgui      && call build_imgui.bat no_pause      && popd
          dir ..\lib\x64

      - name: Build Sonic 3 A.I.R. (Release x64)
        shell: pwsh
        run: |
          & "$env:MSBUILD" game/Oxygen/sonic3air/build/_vstudio/sonic3air.sln /m /p:Configuration=Release /p:Platform=x64 -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Package game folder
        shell: pwsh
        run: |
          $out = "package/Sonic3AIR-Coop"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem -Recurse -Path game/Oxygen/sonic3air/bin -Filter Sonic3AIR.exe | Select-Object -First 1
          if (-not $exe) { throw "Sonic3AIR.exe not found" }
          Copy-Item $exe.FullName $out
          Get-ChildItem -Path $exe.DirectoryName -Filter *.dll | Copy-Item -Destination $out

          Copy-Item -Recurse game/Oxygen/sonic3air/data "$out/data"
          # The engine's own data (shaders, fonts, icon) normally comes from ../oxygenengine/data during development;
          # merge it into the game's data folder so the package runs standalone (no files overlap)
          robocopy game/Oxygen/oxygenengine/data "$out/data" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "Copying engine data failed" }
          $global:LASTEXITCODE = 0
          Copy-Item -Recurse game/Oxygen/sonic3air/scripts "$out/scripts"
          Copy-Item game/Oxygen/sonic3air/oxygenproject.json $out

          # Player-friendly config: no developer shortcuts
          $cfg = Get-Content game/Oxygen/sonic3air/config.json -Raw
          $cfg = $cfg -replace '"EnforceDebugMode":\s*"1"', '"EnforceDebugMode": "0"'
          $cfg = $cfg -replace '"SkipExitConfirmation":\s*"1"', '"SkipExitConfirmation": "0"'
          $cfg = $cfg -replace '"LoadSaveState":\s*"[^"]*",?', ''
          $cfg = $cfg -replace '"StartPhase":\s*"\d"', '"StartPhase": "1"'
          Set-Content -Path "$out/config.json" -Value $cfg -Encoding utf8

          # Portable save data: a local "savedata" folder makes this copy use its own saves, settings and mods,
          # completely separate from a normal Sonic 3 A.I.R. install (which can't run the co-op mod)
          New-Item -ItemType Directory -Force -Path "$out/savedata/mods" | Out-Null
          Copy-Item -Recurse "fork/coop/mod/S3AIR Online Coop" "$out/savedata/mods/"
          Set-Content -Path "$out/savedata/mods/active-mods.json" -Value '{ "ActiveMods": [ "S3AIR Online Coop" ] }' -Encoding ascii

          # Example network config + guide + version info
          Copy-Item fork/coop/coop.json $out
          Copy-Item fork/coop/README.md "$out/CO-OP README.md"
          Set-Content -Path "$out/GAME VERSION.txt" -Value "Built on Sonic 3 A.I.R. ${{ steps.version.outputs.ref }}" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3AIR-Coop-Windows
          path: package/
